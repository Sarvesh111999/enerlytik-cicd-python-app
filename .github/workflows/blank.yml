name: Python CI

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC token request URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397664515:role/GitHubActions-Enerlytik-ECR-Push
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t cicd-python-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag cicd-python-app:${{ github.sha }} \
            767397664515.dkr.ecr.ap-south-1.amazonaws.com/enerlytik-cicd-python-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            767397664515.dkr.ecr.ap-south-1.amazonaws.com/enerlytik-cicd-python-app:${{ github.sha }}
