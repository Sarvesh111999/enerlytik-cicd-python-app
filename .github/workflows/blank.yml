name: Python CI

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC token request URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - name: Debug GitHub repository IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" |
            python -c "import sys,json; d=json.load(sys.stdin); print('Repository ID:', d.get('id')); print('Owner ID:', d.get('owner',{}).get('id'))"
      
      - name: Debug OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          python -c "import sys,base64,json; p=sys.stdin.read().split('.')[1]; p += '='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print('sub:',d.get('sub')); print('aud:',d.get('aud')); print('repository:',d.get('repository')); print('ref:',d.get('ref')); print('repository_id:',d.get('repository_id')); print('repository_owner_id:',d.get('repository_owner_id'))" <<< "$TOKEN"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397664515:role/GitHubActions-Enerlytik-ECR-Push
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t cicd-python-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag cicd-python-app:${{ github.sha }} \
            767397664515.dkr.ecr.ap-south-1.amazonaws.com/enerlytik-cicd-python-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            767397664515.dkr.ecr.ap-south-1.amazonaws.com/enerlytik-cicd-python-app:${{ github.sha }}
